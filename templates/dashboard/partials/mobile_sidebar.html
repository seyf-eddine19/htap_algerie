{% load static i18n %}

<div id="mobile-sidebar" class="fixed inset-0 z-50 flex hidden md:hidden">
    <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm" data-action="toggle-sidebar"></div>

    <div class="relative flex-1 flex flex-col max-w-xs w-full bg-slate-950 text-white p-6 shadow-2xl h-full ltr:mr-auto rtl:ml-auto">
        <div class="flex items-center justify-between pb-6 border-b border-slate-800 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center overflow-hidden shadow-lg shadow-purple-500/20">
                    <img src="{% static 'img/logo.avif' %}" alt="HTAP Algérie" class="w-full h-full object-contain p-1.5">
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">HTAP Algérie</h1>
                    <p class="text-xs text-purple-400 font-medium">{% translate "Administration" %}</p>
                </div>
            </div>

            <button type="button" data-action="toggle-sidebar" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-900 transition">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto py-6 min-h-0">
            {% include "dashboard/partials/sidebar.html" %}
        </div>

        <div class="pt-4 border-t border-slate-800/80 space-y-2 shrink-0">
            <a href="/" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-900 transition">
                <i data-lucide="external-link" class="w-4 h-4"></i>
                {% translate "View website" %}
            </a>

            <a href="{% url 'accounts:account' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-900 transition">
                <i data-lucide="user-cog" class="w-4 h-4"></i>
                {% translate "My Account" %}
            </a>

            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium text-rose-400 hover:text-rose-300 hover:bg-rose-950/30 transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    {% translate "Logout" %}
                </button>
            </form>
        </div>
    </div>
</div>
