{% load i18n %}

<div class="bg-slate-950 text-slate-300 text-xs py-1.5 px-4 sm:px-6 lg:px-8 border-b border-slate-800 flex items-center justify-between z-40 shrink-0 h-[33px]">
    <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            {% translate "System Online" %}
        </span>
        <span class="hidden sm:inline text-slate-500">•</span>
        <span class="hidden sm:inline text-slate-400">HTAP Algérie Management Suite</span>
    </div>

    <div class="flex items-center gap-3 sm:gap-4 text-slate-400">
        <span class="text-[11px] hidden sm:inline-flex items-center gap-1">
            <i data-lucide="clock" class="w-3 h-3 me-1"></i>
            {% now "d F Y" %}
        </span>

        <!-- Language Selector Button -->
        <div class="relative">
            <button type="button" data-action="toggle-language" class="inline-flex items-center gap-1.5 hover:text-white transition">
                <i data-lucide="languages" class="w-3.5 h-3.5"></i>
                <span class="uppercase text-[10px] font-semibold">{{ LANGUAGE_CODE }}</span>
                <i data-lucide="chevron-down" class="w-3 h-3"></i>
            </button>

            <div id="language-menu" class="hidden absolute top-7 end-0 w-36 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl overflow-hidden z-50">
                <form action="{% url 'set_language' %}" method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.get_full_path }}">

                    <button type="submit" name="language" value="ar" class="w-full px-4 py-2.5 text-start text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-between">
                        <span>العربية</span>
                        {% if LANGUAGE_CODE == "ar" %}<i data-lucide="check" class="w-3.5 h-3.5 text-purple-600"></i>{% endif %}
                    </button>

                    <button type="submit" name="language" value="fr" class="w-full px-4 py-2.5 text-start text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-between">
                        <span>Français</span>
                        {% if LANGUAGE_CODE == "fr" %}<i data-lucide="check" class="w-3.5 h-3.5 text-purple-600"></i>{% endif %}
                    </button>

                    <button type="submit" name="language" value="en" class="w-full px-4 py-2.5 text-start text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-between">
                        <span>English</span>
                        {% if LANGUAGE_CODE == "en" %}<i data-lucide="check" class="w-3.5 h-3.5 text-purple-600"></i>{% endif %}
                    </button>
                </form>
            </div>
        </div>

        <!-- Dark Mode Toggle Button -->
        <button type="button" data-action="toggle-theme" title="{% translate 'Toggle dark mode' %}" class="inline-flex items-center justify-center w-7 h-7 rounded-lg hover:bg-white/10 hover:text-white transition">
            <i data-lucide="sun" class="theme-sun-icon w-3.5 h-3.5 hidden dark:block"></i>
            <i data-lucide="moon" class="theme-moon-icon w-3.5 h-3.5 block dark:hidden"></i>
        </button>

        <a href="/" target="_blank" class="hover:text-white transition flex items-center gap-1">
            <i data-lucide="globe" class="w-3 h-3"></i>
            <span class="hidden md:inline">{% translate "Website" %}</span>
        </a>
    </div>
</div>
