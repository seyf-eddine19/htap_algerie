{% load static i18n %}

<div class="flex items-center gap-3">
    <button type="button" data-action="toggle-theme" class="sm:hidden inline-flex items-center justify-center w-9 h-9 rounded-xl text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <i data-lucide="moon" class="theme-moon-icon w-4 h-4 block dark:hidden"></i>
        <i data-lucide="sun" class="theme-sun-icon w-4 h-4 hidden dark:block"></i>
    </button>

    <div class="hidden sm:flex items-center gap-2 ps-4 border-s border-slate-200 dark:border-slate-700">
        <a href="{% url 'accounts:account' %}" class="flex items-center gap-3 group">
            <div class="w-9 h-9 rounded-full bg-white dark:bg-slate-800 border border-purple-200 dark:border-purple-800 flex items-center justify-center overflow-hidden shadow-sm group-hover:border-purple-400 transition">
                <img src="{% static 'img/logo.avif' %}" alt="HTAP Algérie" class="w-full h-full object-contain p-1.5">
            </div>
            <div class="text-start">
                <p class="text-xs font-semibold text-slate-900 dark:text-white group-hover:text-purple-600 dark:group-hover:text-purple-400 transition">
                    {{ request.user.get_full_name|default:request.user.username }}
                </p>
                <p class="text-[10px] text-slate-500 dark:text-slate-400">
                    {% if request.user.is_superuser %}
                        {% translate "Superuser" %}
                    {% elif request.user.is_staff %}
                        {% translate "Administrator" %}
                    {% else %}
                        {% translate "User" %}
                    {% endif %}
                </p>
            </div>
        </a>

        <a href="{% url 'accounts:account' %}" title="{% translate 'My Account' %}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-purple-50 dark:hover:bg-purple-950/30 hover:text-purple-600 dark:hover:text-purple-400 transition">
            <i data-lucide="user-cog" class="w-4 h-4"></i>
        </a>

        <form method="post" action="{% url 'accounts:logout' %}" class="inline">
            {% csrf_token %}
            <button type="submit" title="{% translate 'Logout' %}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 hover:text-rose-600 dark:hover:text-rose-400 transition">
                <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
        </form>
    </div>
</div>
