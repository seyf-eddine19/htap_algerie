{% extends "dashboard/base.html" %}

{% block title %}Supprimer Activité{% endblock %}
{% block header_title %}Confirmation de suppression{% endblock %}

{% block content %}
<div class="max-w-md mx-auto pt-10">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xl p-6 sm:p-8 text-center space-y-6">
        <div class="w-16 h-16 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto">
            <i data-lucide="calendar-x" class="w-8 h-8"></i>
        </div>
        <div>
            <h3 class="text-xl font-bold text-slate-900">Supprimer l'activité ?</h3>
            <p class="text-sm text-slate-500 mt-2">Cette action supprimera l'événement et ses données liées.</p>
        </div>
        <form method="post" class="flex items-center gap-3">
            {% csrf_token %}
            <a href="{% url 'dashboard:activities' %}" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-semibold text-sm">Annuler</a>
            <button type="submit" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-rose-600/30">Supprimer</button>
        </form>
    </div>
</div>
{% endblock %}
