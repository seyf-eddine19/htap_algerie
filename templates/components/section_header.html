{% comment %}
Context Variables:
- eyebrow: Optional short label string
- title: Required primary heading string
- description: Optional supporting text block
{% endcomment %}
<div class="mb-12 max-w-2xl">
    {% if eyebrow %}
        <span class="text-xs font-semibold tracking-wider text-violet-600 dark:text-violet-400 uppercase block mb-2">{{ eyebrow }}</span>
    {% endif %}
    <h2 class="text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white tracking-tight leading-tight">{{ title }}</h2>
    <div class="w-12 h-0.5 bg-gradient-to-r from-violet-600 to-rose-500 dark:from-violet-500 dark:to-rose-400 my-4"></div>
    {% if description %}
        <p class="text-slate-600 dark:text-slate-400 text-base sm:text-lg leading-relaxed mt-3">{{ description }}</p>
    {% endif %}
</div>
