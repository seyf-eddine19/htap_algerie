{% load i18n %}

{% get_current_language as LANGUAGE_CODE %}
{% get_available_languages as LANGUAGES %}
{% get_language_info_list for LANGUAGES as languages %}

<div class="relative inline-block text-start" id="language-switcher">
    <!-- Trigger Button -->
    <button id="language-button" type="button" onclick="toggleLanguageMenu()" class="flex h-10 items-center gap-1 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-2 text-sm font-semibold text-slate-600 dark:text-slate-200 shadow-sm transition hover:border-slate-300 dark:hover:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-violet-500/20" aria-expanded="false" aria-haspopup="true">
        <svg class="h-4 w-4 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12h18M12 3c2.2 2.4 3.4 5.4 3.4 9s-1.2 6.6-3.4 9c-2.2-2.4-3.4-5.4-3.4-9S9.8 5.4 12 3z"></path>
        </svg>

        {% if LANGUAGE_CODE == "ar" %}
            <span>ع</span>
        {% else %}
            <span>{{ LANGUAGE_CODE|upper }}</span>
        {% endif %}

        <svg id="language-chevron" class="h-3.5 w-3.5 text-slate-400 dark:text-slate-500 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9 6 6 6-6"></path>
        </svg>
    </button>

    <!-- Dropdown Menu -->
    <div id="language-menu" class="absolute end-0 top-12 z-50 hidden w-44 overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-1.5 shadow-xl shadow-slate-900/10 transition-all duration-150">
        <form action="{% url 'set_language' %}" method="post" class="space-y-1">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ redirect_to|default:request.get_full_path }}">

            {% for lang in languages %}
                <button type="submit" name="language" value="{{ lang.code }}" class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-start text-sm transition {% if LANGUAGE_CODE == lang.code %}bg-slate-100 dark:bg-slate-700/60 font-semibold text-slate-900 dark:text-white{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/40 hover:text-slate-900 dark:hover:text-white{% endif %}">
                    <span>{{ lang.name_local|capfirst }}</span>
                    {% if LANGUAGE_CODE == lang.code %}
                        <svg class="h-4 w-4 text-violet-600 dark:text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 12 4 4L19 6"></path>
                        </svg>
                    {% endif %}
                </button>
            {% endfor %}
        </form>
    </div>
</div>
